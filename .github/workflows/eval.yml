name: LLM Prompt Regression Check

on:
  pull_request:
    paths:
      - 'prompts/**'
      - 'datasets/**'
      - 'eval_runner.py'

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install groq pydantic pyyaml python-dotenv requests

      - name: Run Evaluation Suite
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python eval_runner.py

      - name: Upload HTML Evaluation Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prompt-eval-report
          path: eval_report.html
          retention-days: 30

      - name: Comment Results on PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Check if eval passed or failed based on exit or file presence
            const outputSummary = `### 🤖 LLM Prompt Evaluation Report
            
            The automated evaluation suite has completed for changes in the \`/prompts\` directory.
            
            - **Model Evaluated:** \`openai/gpt-oss-20b\`
            - **Status:** Check workflow artifacts for the full interactive HTML diff report (`eval_report.html`).`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: outputSummary
            })